services:
  api-backend:
    build: .
    expose:
      - "5000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.01'
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  log-viewer:
    image: amir20/dozzle:latest
    container_name: dozzle-log
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M