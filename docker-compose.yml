services:
  api-backend:
    build: .
    expose:
      - "5000"

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://0.0.0.0:5000/health\")' || exit 1"]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 2s

    deploy:
      replicas: 4 #levantar los cuatro contenedores identicos

      update_config:
        parallelism: 1   #actualizar de 1 en 1
        delay: 10s
        order: start-first
        failure_action: rollback #revertir si algo falla

      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  log-viewer:
    image: amir20/dozzle:latest
    container_name: dozzle-log
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M