services:
  api-backend:
    build: .
    expose:
      - "5000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.01'
          memory: 5M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend